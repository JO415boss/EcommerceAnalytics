# Configuration centrale du projet (Q7.1, Typesafe Config).
# Chemins relatifs a la racine du projet SBT (lancement depuis la racine).
# Toute cle absente est remplacee par une valeur par defaut dans ConfigLoader.

app {
  name = "EcommerceAnalytics"

  spark {
    master = "local[*]"
    shuffle.partitions = 8
  }

  optimization {
    enable-cache     = true
    enable-broadcast = true
  }

  data {
    input {
      transactions = "data/transactions.csv"
      users        = "data/users.json"
      products     = "data/products.parquet"
      merchants    = "data/merchants.csv"
    }
    output {
      path = "output/"
    }
  }

  validation {
    transaction {
      timestamp-length = 14
    }
    user {
      min-age = 16
      max-age = 100
    }
    product {
      min-rating = 1.0
      max-rating = 5.0
    }
    merchant {
      min-commission-rate = 0.0
      max-commission-rate = 1.0
    }
  }
}